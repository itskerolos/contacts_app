name: contact_app
description: "A new Flutter project."


version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_lints: ^6.0.0


flutter_gen:
  output: lib/core/gen/
  integrations:
    image: true
    flutter_svg: true

flutter:

  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

